<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams Notification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: #5B5BD6;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 12px 14px 10px 14px;
        }
        .row { display: flex; gap: 10px; align-items: flex-start; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.95); color: #5B5BD6;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; flex-shrink: 0;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar.hidden { display: none; }
        .content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .kind { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.9; }
        .kind.hidden { display: none; }
        .title { font-size: 13px; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .body { font-size: 12px; color: rgba(255,255,255,0.92); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: break-word; }
        .actions { display: flex; gap: 6px; margin-top: 10px; }
        .actions.hidden { display: none; }
        .actions button {
            flex: 1; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.12);
            color: #fff; font-size: 11px; font-weight: 600; padding: 6px 8px; border-radius: 4px; cursor: pointer;
        }
        .actions button:hover { background: rgba(255,255,255,0.22); }
        footer { display: flex; align-items: center; gap: 6px; font-size: 10px; color: rgba(255,255,255,0.78); margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.14); padding-top: 6px; }
        footer img { width: 12px; height: 12px; opacity: 0.95; }
    </style>
</head>
<body>
    <div class="row">
        <div id="avatar" class="avatar hidden"></div>
        <div class="content">
            <div id="kind" class="kind hidden"></div>
            <div id="title" class="title"></div>
            <div id="body" class="body"></div>
        </div>
    </div>
    <div id="actions" class="actions hidden"></div>
    <footer>
        <img src="../assets/icons/icon-monochrome-light-16x16.png" alt="">
        <span>Teams for Linux</span>
        <span id="time" style="margin-left:auto; opacity:0.85;"></span>
    </footer>
    <script>
        const kindLabels = { direct:'Message', group:'Group', channel:'Channel', mention:'Mention', meeting:'Meeting', call:'Call', missedCall:'Missed call' };
        function setAvatar(data) {
            const el = document.getElementById('avatar');
            if (data.avatarDataUrl && data.avatarDataUrl.startsWith('data:')) {
                el.innerHTML = '<img alt="" src="' + data.avatarDataUrl.replace(/"/g,'&quot;') + '">';
                el.classList.remove('hidden');
            } else if (data.senderInitial) {
                el.textContent = data.senderInitial;
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }
        function setKind(kind) {
            const el = document.getElementById('kind');
            if (kind && kindLabels[kind]) { el.textContent = kindLabels[kind]; el.classList.remove('hidden'); }
            else el.classList.add('hidden');
        }
        function setActions(actions) {
            const c = document.getElementById('actions');
            c.innerHTML = '';
            if (!actions || !actions.length) { c.classList.add('hidden'); return; }
            c.classList.remove('hidden');
            actions.slice(0,2).forEach(a => {
                const b = document.createElement('button');
                b.textContent = a.text || a;
                b.addEventListener('click', (e) => { e.stopPropagation(); globalThis.notificationApi.notifyAction && globalThis.notificationApi.notifyAction(b.textContent); });
                c.appendChild(b);
            });
        }
        globalThis.notificationApi.onNotificationToastInit((data) => {
            document.getElementById('title').textContent = data.title || 'Teams';
            document.getElementById('body').textContent = data.body || '';
            document.getElementById('time').textContent = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
            setAvatar(data);
            setKind(data.kind);
            setActions(data.actions);
            if (data.body) document.getElementById('body').style.display = '';
            else document.getElementById('body').style.display = 'none';
        });
        document.body.addEventListener('click', () => { globalThis.notificationApi.notifyClick(); });
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notification History</title>
  <link rel="stylesheet" href="../assets/css/fluent-parity.css">
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", system-ui, sans-serif; background: #f7f8fc; color: #242424; }
    @media (prefers-color-scheme: dark) { :root { background: #202020; color: #f5f5f5; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
    .muted { color: #6b6b6b; font-size: 13px; }
    @media (prefers-color-scheme: dark) { .muted { color: #bdbdbd; } }
    .toolbar { display: grid; grid-template-columns: minmax(180px, 1fr) 140px 120px 120px; gap: 8px; margin-bottom: 16px; }
    input, select, button { font: inherit; border-radius: 8px; border: 1px solid #c8c8c8; padding: 9px 11px; background: inherit; color: inherit; }
    input:focus, select:focus, button:focus-visible { outline: 2px solid #6264a7; outline-offset: 1px; }
    button { cursor: pointer; background: #fff; }
    @media (prefers-color-scheme: dark) { button { background: #2b2b2b; border-color: #555; } }
    button.primary { background: #6264a7; color: white; border-color: #6264a7; }
    button.danger { color: #b42318; }
    .actions { display: flex; gap: 8px; align-items: center; }
    #empty { text-align: center; padding: 64px 24px; border: 1px dashed #b7b7b7; border-radius: 12px; }
    #list { display: grid; gap: 10px; }
    .entry { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: start; padding: 14px; background: white; border: 1px solid #e4e4e4; border-radius: 12px; box-shadow: 0 1px 2px rgb(0 0 0 / 4%); }
    @media (prefers-color-scheme: dark) { .entry { background: #2b2b2b; border-color: #444; } }
    .entry.unread { border-left: 4px solid #6264a7; padding-left: 11px; }
    .avatar { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: linear-gradient(135deg, #6264a7, #8b8cc7); color: white; font-weight: 700; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .entry-title { font-weight: 650; display: flex; gap: 8px; align-items: baseline; }
    .entry-title small { font-weight: 400; color: #777; }
    .conversation { margin-top: 3px; color: #6264a7; font-size: 13px; }
    .preview { margin: 8px 0 0; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
    .meta { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
    .chip { font-size: 11px; padding: 3px 7px; border-radius: 999px; background: #ececff; color: #44458a; }
    .entry-controls { display: flex; gap: 6px; }
    .entry-controls button { padding: 5px 7px; font-size: 12px; }
    @media (max-width: 680px) { body { padding: 16px; } .toolbar { grid-template-columns: 1fr 1fr; } .entry { grid-template-columns: 34px 1fr; } .avatar { width: 34px; height: 34px; } .entry-controls { grid-column: 2; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Notification History</h1><div class="muted" id="count">Loading…</div></div>
    <div class="actions"><button id="markAll">Mark all read</button><button id="export" class="primary">Export JSON</button><button id="clearAll" class="danger">Clear all</button></div>
  </header>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search sender, conversation, or message" aria-label="Search notification history">
    <select id="category" aria-label="Filter category"><option value="all">All types</option><option value="chats">Chats</option><option value="meetings">Meetings</option><option value="channels">Channels</option><option value="mentions">Mentions</option><option value="calls">Calls</option></select>
    <select id="sort" aria-label="Sort order"><option value="newest">Newest</option><option value="oldest">Oldest</option></select>
    <select id="read" aria-label="Read filter"><option value="all">All</option><option value="unread">Unread</option></select>
  </div>
  <main id="list" aria-live="polite"></main>
  <div id="empty" class="muted" hidden>No notifications match these filters.</div>
<script>
  const api = window.notificationHistoryApi;
  const state = { query: '', category: 'all', sort: 'newest', unreadOnly: false };
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
  const categoryLabel = { chats: 'Chat', meetings: 'Meeting', channels: 'Channel', mentions: 'Mention', calls: 'Call', other: 'Other' };
  function formatDate(timestamp) { try { return new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(timestamp)); } catch { return ''; } }
  function renderEntry(entry) {
    const initial = esc((entry.sender?.displayName || 'T').trim().charAt(0).toUpperCase() || 'T');
    const avatar = entry.sender?.avatar ? '<img src="' + esc(entry.sender.avatar) + '" alt="">' : initial;
    return '<article class="entry ' + (entry.unread ? 'unread' : '') + '">' +
      '<div class="avatar">' + avatar + '</div>' +
      '<div><div class="entry-title">' + esc(entry.sender?.displayName || 'Teams') + ' <small>' + esc(formatDate(entry.timestamp)) + '</small></div>' +
      (entry.conversationTitle ? '<div class="conversation">' + esc(entry.conversationTitle) + '</div>' : '') +
      '<p class="preview">' + esc(entry.preview) + '</p><div class="meta"><span class="chip">' + esc(categoryLabel[entry.category] || entry.type) + '</span><span class="chip">' + esc(entry.urgency) + '</span></div></div>' +
      '<div class="entry-controls"><button data-action="read" data-id="' + esc(entry.id) + '">' + (entry.unread ? 'Mark read' : 'Read') + '</button><button class="danger" data-action="clear" data-id="' + esc(entry.id) + '">Remove</button></div></article>';
  }
  async function refresh() {
    const entries = await api.list(state);
    list.innerHTML = entries.map(renderEntry).join('');
    empty.hidden = entries.length !== 0;
    const unread = await api.unreadCount();
    count.textContent = entries.length + ' shown · ' + unread + ' unread';
    list.querySelectorAll('button[data-action="read"]').forEach((button) => button.addEventListener('click', async () => { await api.markRead(button.dataset.id); refresh(); }));
    list.querySelectorAll('button[data-action="clear"]').forEach((button) => button.addEventListener('click', async () => { await api.clear(button.dataset.id); refresh(); }));
  }
  let searchTimer;
  document.getElementById('search').addEventListener('input', (event) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.query = event.target.value; refresh(); }, 120); });
  document.getElementById('category').addEventListener('change', (event) => { state.category = event.target.value; refresh(); });
  document.getElementById('sort').addEventListener('change', (event) => { state.sort = event.target.value; refresh(); });
  document.getElementById('read').addEventListener('change', (event) => { state.unreadOnly = event.target.value === 'unread'; refresh(); });
  document.getElementById('markAll').addEventListener('click', async () => { await api.markAllRead(); refresh(); });
  document.getElementById('clearAll').addEventListener('click', async () => { if (confirm('Clear all notification history?')) { await api.clearAll(); refresh(); } });
  document.getElementById('export').addEventListener('click', async () => { const data = await api.exportJson(); const blob = new Blob([data], { type: 'application/json' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'teams-for-linux-notification-history.json'; link.click(); URL.revokeObjectURL(link.href); });
  refresh();
</script>
</body>
</html>
